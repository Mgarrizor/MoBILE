# Publications on the models, shown in the Help tab of the GUI.
# pinned: shown first, in this order. The others follow by year, oldest first.
# region: where the model was evaluated or applied.
# domain: Spatial (a grid of cells) or Point (one site).
# side: Vector, Human or Both - where the model was developed - or Application, for a study that uses the model;
# introduced then says what was studied. In introduced, *text* is in italics, as for a species.
